<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrbitGuard</title>
  <meta name="description" content="AI-driven conjunction triage: per-CDM collision probability, 2-day early-warning forecasts and analyst briefings.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%233987e5'/><ellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%23f0efec' stroke-width='2' transform='rotate(-25 16 16)'/></svg>">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
    }
  }
  </script>
</head>
<body>
  <div class="shell">
    <aside class="nav" id="nav">
      <a class="brand" href="#/overview">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="var(--accent)"/><ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-25 16 16)"/><circle cx="28" cy="10.5" r="2" fill="var(--critical)"/></svg>
        <span>OrbitGuard</span>
      </a>
      <nav class="links" id="links"></nav>
      <div class="nav-foot">
        <div class="seg" id="dsSwitch" role="radiogroup" aria-label="Dataset">
          <button data-ds="test" role="radio">Live <small>T-2d</small></button>
          <button data-ds="val" role="radio">Hindsight</button>
        </div>
        <p class="nav-note" id="dsNote"></p>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <form class="jump" id="jump" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="jumpInput" placeholder="Jump to event id" inputmode="numeric" aria-label="Jump to event id">
          <kbd>/</kbd>
        </form>
      </header>
      <main id="view" tabindex="-1"><div class="loading"><div class="spinner"></div>Loading telemetry…</div></main>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
